<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1680" height="470" viewBox="0 0 1680 470" fill="none">
  <defs>
    <filter id="shadow" x="-35%" y="-25%" width="180%" height="190%"><feGaussianBlur in="SourceAlpha" stdDeviation="10"/><feOffset dy="13"/><feComponentTransfer><feFuncA type="linear" slope=".23"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="4"/></filter>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".72" stop-color="#fafafa"/><stop offset="1" stop-color="#e9e9e9"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3333b"/><stop offset="1" stop-color="#b80d19"/></linearGradient>
    <linearGradient id="black" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#333"/><stop offset="1" stop-color="#080808"/></linearGradient>
    <pattern id="ruled" width="180" height="23" patternUnits="userSpaceOnUse"><path d="M0 22.5H180" stroke="#d9d9d9" stroke-width="1"/></pattern>
    <symbol id="brand" viewBox="0 0 120 90">
      <image x="34" y="0" width="52" height="52" xlink:href="/Logo.jpeg" preserveAspectRatio="xMidYMid meet"/>
      <text x="60" y="67" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="900" fill="#d71920">DWARKADHISH</text>
      <text x="60" y="79" text-anchor="middle" font-family="Georgia,serif" font-size="9" font-style="italic" fill="#161616">Paper Products</text>
    </symbol>
  </defs>

  <!-- Bill book -->
  <g filter="url(#shadow)" transform="translate(44 82) rotate(-2 100 170)">
    <path d="M18 12L208 3L218 344L18 352Z" fill="#c9cbd0"/>
    <path d="M0 0L192 0L201 338L0 346Z" fill="url(#paper)" stroke="#d8d8d8" stroke-width="2"/>
    <path d="M0 0H15V346H0Z" fill="#c8cbd1"/>
    <path d="M0 286L201 258V338L0 346Z" fill="url(#red)"/>
    <path d="M0 319L201 292V338L0 346Z" fill="#171717" opacity=".9"/>
    <use xlink:href="#brand" x="36" y="26" width="120" height="90"/>
    <text x="101" y="167" text-anchor="middle" font-family="Arial" font-size="25" font-weight="900" fill="#171717">Bill Book</text>
    <rect x="69" y="188" width="63" height="78" rx="4" fill="#fff" stroke="#222" stroke-width="2"/>
    <text x="100" y="204" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#222">INVOICE</text>
    <path d="M81 219H120M81 231H120M81 243H120M81 255H112" stroke="#777" stroke-width="2"/>
  </g>

  <!-- Letterhead -->
  <g filter="url(#shadow)" transform="translate(280 117) rotate(-1 105 145)">
    <path d="M10 8L220 0L226 286L10 294Z" fill="#cbd0d5"/>
    <path d="M0 0L210 0L216 286L0 294Z" fill="url(#paper)" stroke="#dedede" stroke-width="2"/>
    <path d="M112 0H210V34H145Z" fill="#e31e2b"/>
    <use xlink:href="#brand" x="14" y="17" width="94" height="70"/>
    <rect x="20" y="103" width="174" height="140" fill="url(#ruled)" opacity=".85"/>
    <path d="M0 264L216 248V286L0 294Z" fill="url(#red)"/>
    <path d="M0 282L216 267V286L0 294Z" fill="#171717"/>
  </g>

  <!-- Visiting cards stack -->
  <g filter="url(#shadow)" transform="translate(525 225) rotate(-1 90 90)">
    <rect x="0" y="119" width="188" height="34" rx="4" fill="#e8e8e8"/>
    <path d="M0 123H188M0 130H188M0 137H188M0 144H188" stroke="#c4c4c4" stroke-width="2"/>
    <rect x="0" y="14" width="184" height="112" rx="5" fill="url(#paper)" stroke="#ddd"/>
    <path d="M94 14H184V126H72Z" fill="#e51e2b"/>
    <path d="M0 14H184V126H0Z" fill="url(#paper)" opacity=".95"/>
    <path d="M0 111L184 14V126H0Z" fill="#fff"/>
    <path d="M114 126L184 61V126Z" fill="#d71920"/>
    <use xlink:href="#brand" x="14" y="27" width="94" height="70"/>
  </g>

  <!-- Envelope -->
  <g filter="url(#shadow)" transform="translate(755 213)">
    <rect x="0" y="12" width="224" height="151" rx="6" fill="url(#paper)" stroke="#ddd"/>
    <path d="M0 12H224V64L112 119L0 64Z" fill="url(#red)"/>
    <path d="M0 64L112 143L224 64V163H0Z" fill="#f5f5f5"/>
    <path d="M0 64L112 143L224 64" stroke="#dedede" stroke-width="2"/>
    <use xlink:href="#brand" x="61" y="69" width="104" height="78"/>
  </g>

  <!-- A4 notebook -->
  <g filter="url(#shadow)" transform="translate(1012 14) rotate(-1 110 200)">
    <path d="M10 12L226 0L236 393L10 405Z" fill="#c7cdd1"/>
    <path d="M0 0L216 0L226 393L0 393Z" fill="url(#paper)" stroke="#d9d9d9" stroke-width="2"/>
    <path d="M0 0H12V393H0Z" fill="#df1f2b"/>
    <use xlink:href="#brand" x="47" y="19" width="120" height="90"/>
    <text x="112" y="173" text-anchor="middle" font-family="Arial" font-size="34" font-weight="900" fill="#111">A4</text>
    <text x="112" y="208" text-anchor="middle" font-family="Arial" font-size="25" font-weight="900" fill="#111">Note Book</text>
    <text x="112" y="236" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#555">A4 SIZE · 80 GSM · RULED</text>
    <path d="M0 324L226 294V393H0Z" fill="url(#red)"/>
    <path d="M0 363L226 334V393H0Z" fill="#171717"/>
  </g>

  <!-- Black spiral notebook -->
  <g filter="url(#shadow)" transform="translate(1272 53) rotate(1.2 95 170)">
    <path d="M15 0H196Q204 0 204 8V354H15Z" fill="#070707"/>
    <path d="M24 0H204V354H24Z" fill="url(#black)"/>
    <g fill="#e8e8e8"><circle cx="15" cy="31" r="9"/><circle cx="15" cy="75" r="9"/><circle cx="15" cy="119" r="9"/><circle cx="15" cy="163" r="9"/><circle cx="15" cy="207" r="9"/><circle cx="15" cy="251" r="9"/><circle cx="15" cy="295" r="9"/></g>
    <use xlink:href="#brand" x="65" y="20" width="112" height="84"/>
    <text x="113" y="195" text-anchor="middle" font-family="Georgia,serif" font-size="25" font-style="italic" fill="#fff">Note Book</text>
    <path d="M24 292H204V334H24Z" fill="#d71920"/>
    <path d="M24 334H204V354H24Z" fill="#111"/>
  </g>

  <!-- Branded book stack -->
  <g filter="url(#shadow)" transform="translate(1490 151)">
    <g transform="rotate(-2 75 38)">
      <rect x="0" y="0" width="145" height="72" rx="7" fill="#f7f7f7" stroke="#d5d5d5"/>
      <rect x="0" y="0" width="12" height="72" rx="5" fill="#df1f2b"/>
      <text x="24" y="31" font-family="Arial" font-size="13" font-weight="900" fill="#202020">DWARKADHISH</text>
      <text x="24" y="49" font-family="Arial" font-size="12" font-weight="900" fill="#202020">BOOKS</text>
    </g>
    <g transform="translate(2 80) rotate(1 72 35)">
      <rect x="0" y="0" width="145" height="70" rx="7" fill="#fff" stroke="#d5d5d5"/>
      <rect x="0" y="0" width="12" height="70" rx="5" fill="#222"/>
      <text x="24" y="42" font-family="Arial" font-size="14" font-weight="900" fill="#202020">NOTE BOOK</text>
    </g>
    <g transform="translate(0 158) rotate(-1 72 35)">
      <rect x="0" y="0" width="145" height="70" rx="7" fill="#fff" stroke="#d5d5d5"/>
      <rect x="0" y="0" width="12" height="70" rx="5" fill="#df1f2b"/>
      <text x="24" y="42" font-family="Arial" font-size="13" font-weight="900" fill="#202020">PAPER PRODUCTS</text>
    </g>
  </g>
</svg>