name: Format Code

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prettier:
    name: Format project files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Format source and configuration files
        run: |
          npx --yes prettier@3.6.2 --write \
            "**/*.{js,jsx,ts,tsx,mjs,cjs,json,css,md,yml,yaml}" \
            "!node_modules/**" \
            "!.next/**" \
            "!package-lock.json"

      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "All selected files are already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format project files with Prettier"
          git push
